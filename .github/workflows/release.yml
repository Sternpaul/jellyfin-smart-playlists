name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger the workflow on version tags (e.g., v1.0.0)

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create a release

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 9.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Build Plugin
      run: dotnet build Jellyfin.Plugin.AIRecommender.csproj --configuration Release

    - name: Package Plugin
      run: |
        cd bin/Release/net9.0/
        zip -r Jellyfin.Plugin.AIRecommender.zip Jellyfin.Plugin.AIRecommender.dll

    - name: Extract changelog section for this version
      run: |
        python3 - <<'PY'
        version = "${{ github.ref_name }}"
        try:
            text = open('CHANGELOG.md', encoding='utf-8').read()
        except FileNotFoundError:
            text = ""
        lines = text.splitlines()
        out, capturing = [], False
        for line in lines:
            if line.startswith('## '):
                head = line[3:].strip()
                if head == version or head.startswith(version + ' ') or head.startswith(version + '('):
                    capturing = True
                    out.append(line)
                    continue
                elif capturing:
                    break
            elif capturing:
                out.append(line)
        section = '\n'.join(out).strip() or f"Release {version}"
        print("--- extracted section for %s ---" % version)
        print(section)
        print("--- end ---")
        with open('changelog_section.md', 'w', encoding='utf-8') as f:
            f.write(section + "\n")
        PY

    - name: Delete existing release for this tag (if any)
      continue-on-error: true  # 404 is expected when the release is detached/absent; ignore it
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release delete "${{ github.ref_name }}" --yes 2>/dev/null || true

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ github.ref_name }}" \
          --title "${{ github.ref_name }}" \
          --notes-file changelog_section.md \
          --target "${{ github.sha }}" \
          bin/Release/net9.0/Jellyfin.Plugin.AIRecommender.zip
        # Explicitly mark this tag as Latest so version order (not workflow finish
        # timing) decides the "Latest" flag. For normal single-version releases this
        # is a no-op beyond correctness; for batch re-tags it keeps the highest version Latest.
        gh api -X PATCH "repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" -f make_latest=true
