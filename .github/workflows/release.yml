name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger the workflow on version tags (e.g., v1.0.0)

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create a release

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 9.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Build Plugin
      run: dotnet build Jellyfin.Plugin.AIRecommender.csproj --configuration Release

    - name: Package Plugin
      run: |
        cd bin/Release/net9.0/
        zip -r Jellyfin.Plugin.AIRecommender.zip Jellyfin.Plugin.AIRecommender.dll

    - name: Extract changelog section for this version
      run: |
        python3 - <<'PY'
        version = "${{ github.ref_name }}"
        try:
            text = open('CHANGELOG.md', encoding='utf-8').read()
        except FileNotFoundError:
            text = ""
        lines = text.splitlines()
        out, capturing = [], False
        for line in lines:
            if line.startswith('## '):
                head = line[3:].strip()
                if head == version or head.startswith(version + ' ') or head.startswith(version + '('):
                    capturing = True
                    out.append(line)
                    continue
                elif capturing:
                    break
            elif capturing:
                out.append(line)
        section = '\n'.join(out).strip() or f"Release {version}"
        print("--- extracted section for %s ---" % version)
        print(section)
        print("--- end ---")
        with open('changelog_section.md', 'w', encoding='utf-8') as f:
            f.write(section + "\n")
        PY

    - name: Delete existing release for this tag (if any)
      continue-on-error: true  # 404 is expected when the release is detached/absent; ignore it
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release delete "${{ github.ref_name }}" --yes 2>/dev/null || true

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Create the release directly via the REST API (bypasses `gh release create`'s
        # tag-ref lookup, which 404s in this setup). Body is read from the file.
        gh api -X POST "repos/${{ github.repository }}/releases" \
          -f tag_name="${{ github.ref_name }}" \
          -f name="${{ github.ref_name }}" \
          -f target_commitish="${{ github.sha }}" \
          -f body=@changelog_section.md \
          -F draft=false
        # Upload the built plugin zip as a release asset.
        gh release upload "${{ github.ref_name }}" bin/Release/net9.0/Jellyfin.Plugin.AIRecommender.zip --clobber
        # Explicitly mark this tag as Latest so version order (not workflow finish
        # timing) decides the "Latest" flag.
        gh api -X PATCH "repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" -f make_latest=true
