# ============================================================================
# RELEASE WORKFLOW — Tag-Only Trigger
#
# Builds the plugin, creates a GitHub Release, and publishes the Jellyfin
# plugin manifest to GitHub Pages (gh-pages branch).
#
# The manifest lives on gh-pages, NOT main. This means:
# - Push main whenever you want (it's just source code)
# - No race conditions between developer pushes and workflow pushes
# - The workflow is the sole writer of gh-pages
# ============================================================================
name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger the workflow on version tags (e.g., v1.0.0)

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create a release and push gh-pages

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 9.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Build Plugin
      run: dotnet build Jellyfin.Plugin.AIRecommender.csproj --configuration Release

    - name: Package Plugin
      run: |
        cd bin/Release/net9.0/
        zip -r Jellyfin.Plugin.AIRecommender.zip Jellyfin.Plugin.AIRecommender.dll

    - name: Extract changelog section for this version
      run: |
        python3 - <<'PY'
        version = "${{ github.ref_name }}"
        try:
            text = open('CHANGELOG.md', encoding='utf-8').read()
        except FileNotFoundError:
            text = ""
        lines = text.splitlines()
        out, capturing = [], False
        for line in lines:
            if line.startswith('## '):
                head = line[3:].strip()
                if head == version or head.startswith(version + ' ') or head.startswith(version + '('):
                    capturing = True
                    out.append(line)
                    continue
                elif capturing:
                    break
            elif capturing:
                out.append(line)
        section = '\n'.join(out).strip() or f"Release {version}"
        print("--- extracted section for %s ---" % version)
        print(section)
        print("--- end ---")
        with open('changelog_section.md', 'w', encoding='utf-8') as f:
            f.write(section + "\n")
        PY

    - name: Delete existing release for this tag (if any)
      continue-on-error: true  # 404 expected when detached/absent; ignore it
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release delete "${{ github.ref_name }}" --yes 2>/dev/null || true

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: bin/Release/net9.0/Jellyfin.Plugin.AIRecommender.zip
        body_path: changelog_section.md

    - name: Update plugin manifest on gh-pages
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        version="${{ github.ref_name }}"
        ver_no_prefix="${version#v}"
        # Normalize to a 4-part version (e.g. 1.5.9 -> 1.5.9.0)
        case "$ver_no_prefix" in
          *.*.*.*) ;;
          *.*.*) ver_no_prefix="${ver_no_prefix}.0" ;;
          *.*)   ver_no_prefix="${ver_no_prefix}.0.0" ;;
          *)     ver_no_prefix="${ver_no_prefix}.0.0.0" ;;
        esac
        export ver_no_prefix
        zip_path="bin/Release/net9.0/Jellyfin.Plugin.AIRecommender.zip"
        export checksum=$(md5sum "$zip_path" | awk '{print $1}')
        export timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        export source_url="https://github.com/${{ github.repository }}/releases/download/${version}/Jellyfin.Plugin.AIRecommender.zip"
        export changelog=$(python3 - <<'PY'
        try:
            txt = open('changelog_section.md', encoding='utf-8').read().strip()
        except FileNotFoundError:
            txt = ""
        lines = txt.splitlines()
        if lines and lines[0].startswith('## '):
            lines = lines[1:]
        print('\n'.join(lines).strip())
        PY
        )

        # Fetch gh-pages (or create it if it doesn't exist yet).
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        if git fetch origin gh-pages 2>/dev/null; then
          git checkout gh-pages
        else
          # First release: create an orphan gh-pages branch with just the manifest.
          git checkout --orphan gh-pages
          git rm -rf .
          mkdir -p repo
          echo '[]' > repo/manifest.json
          git add repo/manifest.json
          git commit -m "Initialize gh-pages with empty manifest"
        fi

        # Update the manifest JSON.
        python3 - <<PY
        import json, os
        manifest_path = "repo/manifest.json"
        with open(manifest_path, encoding="utf-8") as f:
            manifest = json.load(f)
        GUID = "3D3D8BE7-67AB-4F65-9F31-3EAE8764BBA3"
        plugin = next((p for p in manifest if p.get("guid") == GUID), None)
        if plugin is None:
            plugin = {
                "guid": GUID,
                "name": "AI Recommender",
                "description": "AI-powered smart playlists and recommendations for Jellyfin.",
                "overview": "Builds real similarity-ranked playlists that learn from your watch history.",
                "owner": "Sternpaul",
                "category": "AI Recommender",
                "versions": []
            }
            manifest.append(plugin)
        new_entry = {
            "version": os.environ["ver_no_prefix"],
            "changelog": os.environ["changelog"],
            "targetAbi": "10.11.0.0",
            "sourceUrl": os.environ["source_url"],
            "checksum": os.environ["checksum"],
            "timestamp": os.environ["timestamp"],
        }
        versions = plugin.setdefault("versions", [])
        for i, v in enumerate(versions):
            if v.get("version") == os.environ["ver_no_prefix"]:
                versions[i] = new_entry
                break
        else:
            versions.insert(0, new_entry)
        with open(manifest_path, "w", encoding="utf-8") as f:
            json.dump(manifest, f, indent=2, ensure_ascii=False)
            f.write("\n")
        print("Updated manifest with version", os.environ["ver_no_prefix"])
        PY

        git add repo/manifest.json
        if git diff --cached --quiet; then
          echo "manifest unchanged; nothing to push"
          exit 0
        fi
        git commit -m "manifest: add ${version}"
        git push origin gh-pages
