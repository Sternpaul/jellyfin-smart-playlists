name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger the workflow on version tags (e.g., v1.0.0)

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create a release

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 9.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Build Plugin
      run: dotnet build Jellyfin.Plugin.AIRecommender.csproj --configuration Release

    - name: Package Plugin
      run: |
        cd bin/Release/net9.0/
        zip -r Jellyfin.Plugin.AIRecommender.zip Jellyfin.Plugin.AIRecommender.dll

    - name: Extract changelog section for this version
      id: changelog
      run: |
        python3 - <<'PY'
        import os
        version = "${{ github.ref_name }}"
        try:
            text = open('CHANGELOG.md', encoding='utf-8').read()
        except FileNotFoundError:
            text = ""
        lines = text.splitlines()
        out, capturing = [], False
        for line in lines:
            if line.startswith('## '):
                head = line[3:].strip()
                if head == version or head.startswith(version + ' ') or head.startswith(version + '('):
                    capturing = True
                    out.append(line)
                    continue
                elif capturing:
                    break
            elif capturing:
                out.append(line)
        section = '\n'.join(out).strip() or f"Release {version}"
        with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
            f.write("body<<EOF\n")
            f.write(section + "\n")
            f.write("EOF\n")
        PY

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: bin/Release/net9.0/Jellyfin.Plugin.AIRecommender.zip
        body: ${{ steps.changelog.outputs.body }}
        # generate_release_notes left OFF so the curated changelog is shown verbatim.
