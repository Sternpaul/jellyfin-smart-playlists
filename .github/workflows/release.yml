# ============================================================================
# RELEASE WORKFLOW — Tag-Only Trigger
#
# Builds the plugin, creates a GitHub Release, and publishes the Jellyfin
# plugin manifest to GitHub Pages (gh-pages branch).
#
# The manifest lives on gh-pages, NOT main. This means:
# - Push main whenever you want (it's just source code)
# - No race conditions between developer pushes and workflow pushes
# - The workflow is the sole writer of gh-pages
# ============================================================================
name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger the workflow on version tags (e.g., v1.0.0)

concurrency:
  group: release-manifest-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create a release and push gh-pages

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 9.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Verify tag matches project version
      run: |
        python3 - <<'PY'
        import os, re, xml.etree.ElementTree as ET
        tag = os.environ['GITHUB_REF_NAME']
        raw = tag.removeprefix('v')
        parts = raw.split('.')
        if not all(part.isdigit() for part in parts) or not 2 <= len(parts) <= 4:
            raise SystemExit(f"invalid release tag: {tag}")
        expected = '.'.join(parts + ['0'] * (4 - len(parts)))
        actual = ET.parse('Jellyfin.Plugin.AIRecommender.csproj').getroot().findtext('.//Version')
        if actual != expected:
            raise SystemExit(f"tag {tag} requires project version {expected}, found {actual}")
        print(f"verified tag/project version: {expected}")
        PY

    - name: Restore solution
      run: dotnet restore Jellyfin.Plugin.AIRecommender.sln

    - name: Build Plugin
      run: dotnet build Jellyfin.Plugin.AIRecommender.csproj --configuration Release --no-restore

    - name: Run Tests
      run: dotnet test Jellyfin.Plugin.AIRecommender.sln --configuration Release --no-restore --logger "console;verbosity=minimal"

    - name: Package Plugin
      run: |
        python3 - <<'PY'
        import pathlib, zipfile
        root = pathlib.Path('bin/Release/net9.0')
        dll = root / 'Jellyfin.Plugin.AIRecommender.dll'
        archive = root / 'Jellyfin.Plugin.AIRecommender.zip'
        with zipfile.ZipFile(archive, 'w', compression=zipfile.ZIP_DEFLATED) as package:
            package.write(dll, dll.name)
        with zipfile.ZipFile(archive) as package:
            assert package.namelist() == [dll.name]
        print(f'packaged {dll.name} only')
        PY

    - name: Extract changelog section for this version
      run: |
        python3 - <<'PY'
        version = "${{ github.ref_name }}"
        try:
            text = open('CHANGELOG.md', encoding='utf-8').read()
        except FileNotFoundError:
            text = ""
        lines = text.splitlines()
        out, capturing = [], False
        for line in lines:
            if line.startswith('## '):
                head = line[3:].strip()
                if head == version or head.startswith(version + ' ') or head.startswith(version + '('):
                    capturing = True
                    out.append(line)
                    continue
                elif capturing:
                    break
            elif capturing:
                out.append(line)
        section = '\n'.join(out).strip()
        if not section:
            raise SystemExit(f"CHANGELOG.md has no section for {version}")
        print("--- extracted section for %s ---" % version)
        print(section)
        print("--- end ---")
        with open('changelog_section.md', 'w', encoding='utf-8') as f:
            f.write(section + "\n")
        PY

    - name: Refuse to replace an existing release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
          echo "release ${{ github.ref_name }} already exists; published releases are immutable" >&2
          exit 1
        fi

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: bin/Release/net9.0/Jellyfin.Plugin.AIRecommender.zip
        body_path: changelog_section.md

    - name: Update plugin manifest on gh-pages
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        version="${{ github.ref_name }}"
        ver_no_prefix="${version#v}"
        # Normalize to a 4-part version (e.g. 1.5.9 -> 1.5.9.0)
        case "$ver_no_prefix" in
          *.*.*.*) ;;
          *.*.*) ver_no_prefix="${ver_no_prefix}.0" ;;
          *.*)   ver_no_prefix="${ver_no_prefix}.0.0" ;;
          *)     ver_no_prefix="${ver_no_prefix}.0.0.0" ;;
        esac
        export ver_no_prefix
        zip_path="bin/Release/net9.0/Jellyfin.Plugin.AIRecommender.zip"
        export checksum=$(md5sum "$zip_path" | awk '{print $1}')
        export timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        export source_url="https://github.com/${{ github.repository }}/releases/download/${version}/Jellyfin.Plugin.AIRecommender.zip"
        export changelog=$(python3 - <<'PY'
        try:
            txt = open('changelog_section.md', encoding='utf-8').read().strip()
        except FileNotFoundError:
            txt = ""
        lines = txt.splitlines()
        if lines and lines[0].startswith('## '):
            lines = lines[1:]
        print('\n'.join(lines).strip())
        PY
        )

        # Fetch gh-pages (or create it if it doesn't exist yet).
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        if git fetch origin gh-pages 2>/dev/null; then
          git checkout -B gh-pages origin/gh-pages
        else
          # First release: create an orphan gh-pages branch with just the manifest.
          git checkout --orphan gh-pages
          git rm -rf .
          mkdir -p repo
          echo '[]' > repo/manifest.json
          git add repo/manifest.json
          git commit -m "Initialize gh-pages with empty manifest"
        fi

        # Update the manifest JSON.
        python3 - <<PY
        import json, os
        manifest_path = "repo/manifest.json"
        with open(manifest_path, encoding="utf-8") as f:
            manifest = json.load(f)
        GUID = "3D3D8BE7-67AB-4F65-9F31-3EAE8764BBA3"
        plugin = next((p for p in manifest if p.get("guid") == GUID), None)
        if plugin is None:
            plugin = {
                "guid": GUID,
                "name": "AI Recommender",
                "description": "AI-powered smart playlists and recommendations for Jellyfin.",
                "overview": "Builds real similarity-ranked playlists that learn from your watch history.",
                "owner": "Sternpaul",
                "category": "AI Recommender",
                "versions": []
            }
            manifest.append(plugin)
        new_entry = {
            "version": os.environ["ver_no_prefix"],
            "changelog": os.environ["changelog"],
            "targetAbi": "10.11.0.0",
            "sourceUrl": os.environ["source_url"],
            "checksum": os.environ["checksum"],
            "timestamp": os.environ["timestamp"],
        }
        versions = plugin.setdefault("versions", [])
        for i, v in enumerate(versions):
            if v.get("version") == os.environ["ver_no_prefix"]:
                versions[i] = new_entry
                break
        else:
            versions.insert(0, new_entry)
        with open(manifest_path, "w", encoding="utf-8") as f:
            json.dump(manifest, f, indent=2, ensure_ascii=False)
            f.write("\n")
        print("Updated manifest with version", os.environ["ver_no_prefix"])
        PY

        python3 - <<'PY'
        import json, os, re
        manifest = json.load(open('repo/manifest.json', encoding='utf-8'))
        guid = '3D3D8BE7-67AB-4F65-9F31-3EAE8764BBA3'
        plugin = next(p for p in manifest if p.get('guid') == guid)
        entry = next(v for v in plugin.get('versions', []) if v.get('version') == os.environ['ver_no_prefix'])
        assert entry['targetAbi'] == '10.11.0.0'
        assert entry['sourceUrl'] == os.environ['source_url']
        assert entry['checksum'] == os.environ['checksum']
        assert re.fullmatch(r'[0-9a-f]{32}', entry['checksum'])
        assert entry.get('changelog', '').strip()
        assert not entry['changelog'].startswith('Release v')
        print('validated generated manifest entry', entry['version'])
        PY

        git add repo/manifest.json
        if git diff --cached --quiet; then
          echo "manifest unchanged; nothing to push"
          exit 0
        fi
        git commit -m "manifest: add ${version}"
        git push origin gh-pages

    - name: Verify public manifest and release artifact
      run: |
        python3 - <<'PY'
        import hashlib, io, json, os, time, urllib.request, zipfile
        version = os.environ['GITHUB_REF_NAME']
        raw = version.removeprefix('v').split('.')
        expected_version = '.'.join(raw + ['0'] * (4 - len(raw)))
        manifest_url = 'https://sternpaul.github.io/jellyfin-smart-playlists/repo/manifest.json'
        deadline = time.time() + 120
        entry = None
        while time.time() < deadline:
            with urllib.request.urlopen(f'{manifest_url}?t={time.time_ns()}', timeout=20) as response:
                manifest = json.load(response)
            plugin = next((p for p in manifest if p.get('guid') == '3D3D8BE7-67AB-4F65-9F31-3EAE8764BBA3'), None)
            entry = next((v for v in (plugin or {}).get('versions', []) if v.get('version') == expected_version), None)
            if entry:
                break
            time.sleep(5)
        if not entry:
            raise SystemExit(f'public manifest did not publish {expected_version} within 120 seconds')
        assert entry['targetAbi'] == '10.11.0.0'
        assert entry.get('changelog', '').strip() and not entry['changelog'].startswith('Release v')
        expected_source = f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/releases/download/{version}/Jellyfin.Plugin.AIRecommender.zip'
        assert entry['sourceUrl'] == expected_source
        with urllib.request.urlopen(f"{entry['sourceUrl']}?t={time.time_ns()}", timeout=30) as response:
            archive = response.read()
        assert hashlib.md5(archive).hexdigest() == entry['checksum']
        with zipfile.ZipFile(io.BytesIO(archive)) as package:
            assert package.namelist() == ['Jellyfin.Plugin.AIRecommender.dll']
        print('verified public manifest, checksum, changelog, ABI, source URL, and single-DLL ZIP')
        PY
